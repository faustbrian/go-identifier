schema_version: 1
tool_version: v2.5.1
tool_checksums_sha256: ca1293ba633e3ebb5197134cd586979db4e0af51a37e0de0bad2884005327c15
manifest:
  modules: modules.json
  packages: packages.json
evidence:
  root: ".verification"
mutation:
  root: ".verification/mutation"
  imports:
  - module: "."
    archive: ".verification/mutation/bootstrap/root.zip"
    ledger: ".verification/mutation/migration-ledger.json"
api:
  baselines:
  - module: "."
    mode: go-doc
    path: api/v2/baseline.txt
    packages:
    - "."
    - ./uuid
    - ./ulid
    - ./typeid
    - ./ksuid
    - ./nanoid
    - ./slug
    - ./idtest
operations:
# Shared generators must serialize state and produce every unique result.
- module: "."
  gate: local-test
  steps:
  - type: go-test
    packages: ["."]
    run: '^TestEverySharedGeneratorHasAtomicUniqueStateTransitions$'
    race: true
    count: 1
    timeout: 2m
  - type: go-test
    packages: ["."]
    run: '^Test(Identity|Unicode151).*$'
    count: 1
    timeout: 1m
- module: "."
  gate: conformance
  steps:
  - type: go-test
    packages: ["./uuid", "./ulid", "./typeid", "./ksuid", "./nanoid", "./slug"]
    count: 1
    timeout: 20m
  - type: go-test
    packages: ["."]
    run: '^TestPinnedCrossLanguageVectors$|^TestMaintainedImplementationInteroperability$|^TestEverySharedGeneratorHasAtomicUniqueStateTransitions$|^TestNanoIDRejectionSamplingHasNoModuloBias$|^TestIdentity|^TestUnicode151'
    count: 1
    timeout: 20m
- module: "."
  gate: test
  steps:
  - type: make
    makefile: verification/package.mk
    target: provenance
    timeout: 20m
  - type: go-test
    packages: ["./..."]
    run: 'SQL|Database|PostgreSQL|Serialization'
    timeout: 20m
- module: "."
  gate: fuzz
  steps:
  - type: go-test
    packages: ["."]
    fuzz: '^FuzzIdentityNormalization$'
    budget: 2s
    timeout: 2m
  - type: go-test
    packages: ["."]
    fuzz: '^FuzzUUIDParse$'
    budget: 2s
    timeout: 2m
  - type: go-test
    packages: ["."]
    fuzz: '^FuzzULIDParse$'
    budget: 2s
    timeout: 2m
  - type: go-test
    packages: ["."]
    fuzz: '^FuzzTypeIDParse$'
    budget: 2s
    timeout: 2m
  - type: go-test
    packages: ["."]
    fuzz: '^FuzzKSUIDParse$'
    budget: 2s
    timeout: 2m
  - type: go-test
    packages: ["."]
    fuzz: '^FuzzNanoIDParse$'
    budget: 2s
    timeout: 2m
  - type: go-test
    packages: ["."]
    fuzz: '^FuzzBinaryAndJSONCodecs$'
    budget: 2s
    timeout: 2m
  - type: go-test
    packages: ["./slug"]
    fuzz: '^FuzzLaravelEnglish$'
    budget: 2s
    timeout: 2m
- module: "."
  gate: docs
  steps:
  - type: go-test
    packages: ["./..."]
    run: '^Example'
    timeout: 20m
- module: "."
  gate: benchmark
  steps:
  - type: go-test
    packages: ["./..."]
    benchmark: "."
    budget: 100ms
    timeout: 20m
